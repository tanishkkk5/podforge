# The one automatic check (decision 0010): runs on every push and pull request.
name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Knowledge files have valid headers
        run: node scripts/check-knowledge.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: App builds
        run: npm run build
